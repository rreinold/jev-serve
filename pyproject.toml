[project]
name = "jev-serve"
version = "0.1.0"
description = "Typed probabilistic decisions via logit readout — no text generation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "mlx-lm>=0.31; sys_platform == 'darwin'",
]

[project.optional-dependencies]
api = ["openai>=1.0"]

[project.scripts]
jev-serve = "jev.serve:main"

[project.urls]
Repository = "https://github.com/rreinold/jev-serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jev*"]
